name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-review:
    runs-on: ubuntu-latest
    # Dependabot bumps are mechanical and already covered by the build job.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # No actions/checkout: the action fetches the diff and its config via the
      # GitHub API. A checkout of the PR head would let a branch ship a
      # pyproject.toml overriding [openai] api_base and receive the gateway
      # token. The config ref is pinned to main for the same reason.
      - uses: the-pr-agent/pr-agent@c6a076d6f9fb59029341b0b4f5662ed522d11589
        id: pr-agent
        env:
          # Cloudflare AI Gateway, same route as houses/omp-config:
          # dynamic/fallback2 (OpenCode primary -> DeepSeek fallback).
          OPENAI_KEY: ${{ secrets.CLOUDFLARE_AIGATEWAY_TOKEN }}
          OPENAI_BASE_URL: https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_CONFIG_BRANCH: main
          # The gateway's head-only keys; repo settings ignore extra_headers,
          # so supply them through Dynaconf's highest-precedence env layer.
          LITELLM__EXTRA_HEADERS: '{"cf-aig-request-timeout": "1800000", "cf-aig-max-attempts": "0", "cf-aig-backoff": "exponential", "cf-aig-metadata": "{\"source\":\"review\",\"repo\":\"side-by-side\"}"}'

      - name: Check review succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHA:0:7}"
          if [ -z "$PR_NUM" ]; then
            echo "Manual trigger — skipping review check (no PR number)"
            exit 0
          fi
          # A human "/skip" comment opts this PR out of the AI review (config
          # skip_commands in .pr_agent.toml): pr-agent then posts nothing, which
          # must NOT fail the PR. Deliberate opt-out only. Only the PR author and
          # users with write access may opt out — on a public repo an arbitrary
          # commenter could otherwise disable the review gate. Anchored to the
          # start of a line so a conversational mention does not opt the PR out.
          if gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUM/comments" \
            --jq '[.[] | select(.user.login != "github-actions[bot]") | select(.user.login == "${{ github.event.pull_request.user.login }}" or .author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | select(.body | test("(^|\\n)\\s*/skip(\\s|$)"; "i"))] | length' \
            | grep -q '[1-9]'; then
            echo "Review check passed — AI review skipped via /skip comment"
            exit 0
          fi
          # All bot comments for this PR. --paginate with a per-page --jq filter
          # concatenates page results (invalid JSON on multi-page PRs), so stream
          # the matches and slurp them into one array. A failed API call must not
          # look like "no review posted": retry, then fail with the real cause.
          CMTS=""
          for attempt in 1 2 3; do
            if gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUM/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]")' > /tmp/raw_comments 2>/tmp/gh_api_err; then
              CMTS=$(jq -s '.' < /tmp/raw_comments)
              break
            fi
            [ "$attempt" -lt 3 ] && sleep 5
          done
          if [ -z "$CMTS" ]; then
            echo "::error::comments API failed after 3 attempts: $(tail -c 500 /tmp/gh_api_err)"
            exit 1
          fi
          # Scope to comments from THIS run: a comment names the head commit by
          # full or short sha, token-bounded so an unrelated hex string cannot
          # false-positive. Stale comments are excluded, so the failure and
          # no-comments branches diagnose the current run correctly.
          THIS=$(echo "$CMTS" | jq -c --arg full "$SHA" --arg short "$SHORT_SHA" \
            '[.[] | select(.body | test("(^|[^0-9a-f])(" + $full + "|" + $short + ")([^0-9a-f]|$)"; "i"))]')
          # The latest bot comment can legitimately carry NO sha: a review that
          # found nothing posts "no code suggestions", and a standalone review
          # (posted when the persistent one cannot be updated) carries none
          # either. Both are pass states; treating them as "no review posted"
          # failed every clean PR (the v1.1.0 release PR hit exactly this).
          LAST=$(echo "$CMTS" | jq -c 'sort_by(.created_at) | last')
          if echo "$THIS" | jq -e '[.[] | select(.body | test("PR Reviewer Guide|PR Code Suggestions"))] | length > 0' >/dev/null 2>&1; then
            echo "Review check passed"
          elif echo "$THIS" | jq -e '[.[] | select(.body | test("failed"; "i"))] | length > 0' >/dev/null 2>&1; then
            echo "::error::PR-Agent reported a failure:"
            echo "$THIS" | jq -r '.[].body'
            exit 1
          elif echo "$LAST" | jq -e '.body | test("PR Reviewer Guide|PR Code Suggestions|pr-agent:improve:no-suggestions")' >/dev/null 2>&1; then
            echo "Review check passed (latest comment: standalone review or no-suggestions)"
          elif [ "$(echo "$THIS" | jq 'length' 2>/dev/null || echo 0)" = "0" ]; then
            echo "::error::PR-Agent posted no comments for commit $SHA — review was skipped or failed silently"
            exit 1
          else
            echo "::error::PR-Agent comment found for this commit but matched no known pattern"
            echo "$THIS" | jq -r '.[].body'
            exit 1
          fi
