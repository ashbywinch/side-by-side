[openai]
custom_llm_provider = "openai"
# Cloudflare AI Gateway, same route as houses/omp-config:
# dynamic/fallback2 (OpenCode primary -> DeepSeek fallback).
api_base = "https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat"

[config]
model = "openai/dynamic/fallback2"
custom_model_max_tokens = 128000
max_model_tokens = 128000
ai_timeout = 1800
fallback_models = []
# Standards/docs are read from main, never from the PR head.
repo_context_from_default_branch = true
repo_context_files = [
  "README.md",
  "docs/deployment.md",
  "docs/translation-repair.md",
]
# The gateway route reasons by default and reasoning tokens come out of the
# completion budget; disable it for the review, as the house repos do.
reasoning_effort = "none"
additional_reasoning_effort_models = ["dynamic/fallback2"]
temperature = 0.8
verbosity_level = 1

[ignore]
glob = [
    "corpus/**",
    "src/assets/index.json",
]

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = true
num_max_findings = 10

[pr_code_suggestions]
persistent_comment = true

[github_action_config]
handle_push_trigger = true
push_commands = ["/review"]
skip_commands = ["/skip"]

# cf-aig-* headers are supplied by the workflow's LITELLM__EXTRA_HEADERS env
# because this PR-Agent version treats [litellm].extra_headers as host-only
# when it comes from repo settings.
