name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-stage:
    name: Verify, build and stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_id: ${{ steps.version.outputs.version_id }}
      green_url: ${{ steps.version.outputs.preview_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not configured; preview and production deploys are skipped."
          fi

      - name: Check Worker exists
        id: worker
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/side-by-side")
          case "$CODE" in
            200|204) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Worker does not exist yet; no PR preview until the first production deploy creates it."
              ;;
          esac

      - name: Use Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Setup
        run: make setup

      - name: Lint
        run: make lint

      - name: Validate corpus
        run: make check-corpus

      - name: Tests and coverage
        run: make test

      - name: Build
        run: make dist

      - name: Require Cloudflare credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.configured != 'true'
        run: |
          echo "::error::CF_API_TOKEN and CF_ACCOUNT_ID must be configured before deploying."
          exit 1

      - name: Require existing Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.configured == 'true' && steps.worker.outputs.exists != 'true'
        run: |
          echo "::error::Worker side-by-side does not exist. Bootstrap it once through an approved deploy before using green releases."
          exit 1

      - name: Stage green version
        id: stage
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.configured == 'true' && steps.worker.outputs.exists == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: versions upload --tag ${{ github.sha }} --message release-${{ github.sha }} --preview-alias green-${{ github.run_id }}

      - name: Read staged version
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.configured == 'true' && steps.worker.outputs.exists == 'true'
        env:
          WRANGLER_OUTPUT: ${{ steps.stage.outputs.command-output }}
        run: |
          CLEAN=$(printf '%s' "$WRANGLER_OUTPUT" | sed -E 's/\x1B\[[0-9;]*[mK]//g')
          VERSION_ID=$(printf '%s\n' "$CLEAN" | sed -n 's/.*Worker Version ID: *//p' | head -n1 | tr -d '\r')
          PREVIEW_URL=$(printf '%s\n' "$CLEAN" | grep -oE 'Version Preview Alias URL: *https://[^[:space:]]+' | sed 's/.*https/https/' | head -n1 | tr -d '\r')
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(printf '%s\n' "$CLEAN" | grep -oE 'Version Preview URL: *https://[^[:space:]]+' | sed 's/.*https/https/' | head -n1 | tr -d '\r')
          fi
          if ! [[ "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]] || [ -z "$PREVIEW_URL" ]; then
            echo "::error::Could not parse the staged Worker version from wrangler output."
            printf '%s\n' "$CLEAN" | tail -30
            exit 1
          fi
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Green candidate"
            echo ""
            echo "- Version: \`$VERSION_ID\`"
            echo "- Preview: $PREVIEW_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test green
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cloudflare.outputs.configured == 'true' && steps.worker.outputs.exists == 'true'
        run: >
          node scripts/smoke.mjs --base "${{ steps.version.outputs.preview_url }}"
          --sha "$GITHUB_SHA" --attempts 12 --delay 5000

      - name: Upload preview version
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.cloudflare.outputs.configured == 'true' && steps.worker.outputs.exists == 'true'
        id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: versions upload --preview-alias pr-${{ github.event.number }}

      - name: Read preview URL
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.cloudflare.outputs.configured == 'true' && steps.worker.outputs.exists == 'true'
        id: preview_outputs
        env:
          WRANGLER_OUTPUT: ${{ steps.preview.outputs.command-output }}
        run: |
          CLEAN=$(printf '%s' "$WRANGLER_OUTPUT" | sed -E 's/\x1B\[[0-9;]*[mK]//g')
          URL=$(printf '%s\n' "$CLEAN" | grep -oE 'Version Preview Alias URL: *https://[^[:space:]]+' | sed 's/.*https/https/' | head -n1 | tr -d '\r')
          if [ -z "$URL" ]; then
            echo "::error::Could not find a preview URL in the wrangler output"
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.cloudflare.outputs.configured == 'true' && steps.worker.outputs.exists == 'true'
        run: >
          node scripts/smoke.mjs --base "${{ steps.preview_outputs.outputs.preview_url }}"
          --sha "$GITHUB_SHA" --attempts 6 --delay 5000

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.cloudflare.outputs.configured == 'true' && steps.worker.outputs.exists == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.preview_outputs.outputs.preview_url }}
        with:
          script: |
            const marker = "<!-- side-by-side-preview -->";
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}\n\nSHA: \`${context.sha}\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  promote:
    name: Promote approved version
    needs: build-and-stage
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Check staged version
        env:
          VERSION_ID: ${{ needs.build-and-stage.outputs.version_id }}
          GREEN_URL: ${{ needs.build-and-stage.outputs.green_url }}
        run: |
          if [ -z "$VERSION_ID" ]; then
            echo "::error::No staged version to promote."
            exit 1
          fi
          echo "Promoting $VERSION_ID"
          echo "Green candidate: $GREEN_URL"

      - name: Promote version
        id: promote
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: versions deploy ${{ needs.build-and-stage.outputs.version_id }}@100% --name side-by-side --yes

      - name: Smoke test production
        id: smoke
        run: >
          node scripts/smoke.mjs --base https://sbs.blueumbrella.net
          --sha "$GITHUB_SHA" --attempts 12 --delay 5000

      - name: Tag release and production
        if: success()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a production "$GITHUB_SHA" -m "Production deployment $GITHUB_SHA"
          git push --force origin production
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            TAG_NOTE="v$VERSION already existed; left in place"
          else
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then git tag -d "v$VERSION"; fi
            git tag -a "v$VERSION" "$GITHUB_SHA" -m "Release v$VERSION"
            git push origin "v$VERSION"
            TAG_NOTE="created v$VERSION"
          fi
          {
            echo "### Production"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: \`$VERSION\`"
            echo "- \`production\` tag moved to this commit"
            echo "- $TAG_NOTE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back on failed smoke
        if: failure() && steps.smoke.outcome == 'failure'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: rollback --name side-by-side --yes
