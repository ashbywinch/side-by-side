# Dependabot — weekly for npm and github-actions.
#
# Patch/minor and major updates are grouped per ecosystem. Patch/minor may
# auto-merge on green CI; majors stay human-reviewed. github-actions bumps are
# never grouped or auto-merged: action refs are SHA-pinned and need a human to
# update the pin.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
